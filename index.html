## Quem somos e Nossa missão
A **BRAN Org** é uma organização independente dedicada a construir infraestrutura aberta para a informação acadêmica e científica no **Brasil**.

Mapeamos **dados acadêmicos que já são públicos**, mas que não oferecem APIs ou formas fáceis de acesso programático. Nosso trabalho é coletar, tratar e disponibilizar essas informações em formatos abertos e padronizados, por meio de APIs públicas e ferramentas *open-source*, reduzindo barreiras técnicas para pesquisadores e impulsionando os estudos sobre a produção científica brasileira.

## Nossos objetivos
- **Mapear fontes brasileiras**: Identificar acervos, repositórios e bases acadêmicas públicas que carecem de acesso programático.
- **Estruturar dados públicos**: Converter dados brutos ou fragmentados em formatos limpos, padronizados e prontos para análise.
- **Criar APIs abertas**: Disponibilizar endpoints públicos e acessíveis para integração em pesquisas e aplicações.
- **Desenvolver ferramentas**: Construir pacotes e aplicações voltadas à análise quantitativa da produção científica.

## Nossos projetos

### Bases de Dados & Acervos

Esta seção reúne os acervos e repositórios acadêmicos públicos mantidos e curados pela **BRAN Org**:

- **O que é**: O catálogo central de bases de dados acadêmicas brasileiras convertidas para formatos abertos e estruturados.
- **O que contém**: Dados bibliométricos completos de eventos e periódicos científicos (artigos, autores, afiliações, resumos, citações e metadados metodológicos).
- **Como funciona**: Cada repositório disponibiliza os dados em arquivos padronizados (`JSON`/`CSV`), acompanhados por uma **API REST pública e gratuita** (sem necessidade de chaves) e um **Dashboard Web interativo** para consulta e análise visual em tempo real.

<details>
<summary><b>Níveis de Confiabilidade dos Dados</b></summary>
<br>

Para assegurar transparência acadêmica e rigor científico, cada repositório da **BRAN Org** possui uma marcação de confiabilidade e integridade dos dados:

- 🟢 **Verde (100% Auditado & Completo)**: Dados totalmente extraídos, validados e higienizados. Contém todos os metadados fundamentais sem lacunas conhecidas.
- 🔵 **Azul (Alta Fidelidade com Omissões Esparsas da Fonte)**: Cobertura completa de edições/anos e DOIs, contendo apenas raras ausências de metadados herdadas do próprio site oficial.
- 🟡 **Amarelo (100% Fiel à Fonte com Limitações da Origem)**: 100% dos artigos disponibilizados online no site oficial extraídos sem perdas, porém o site oficial apresenta limitações nativas (ex: ausência de DOIs nos anais ou falta dos primeiros anais históricos que não estão online). *(Ex: `ebbc-open-database`)*.
- 🟠 **Laranja (Em Curadoria / Processamento)**: Extração realizada com sucesso, mas o acervo ainda passa por etapas de curadoria, validação de schema e saneamento de metadados. *(Ex: `abec-open-database`)*.
- 🔴 **Vermelho (Dados Não Auditados / Baixa Confiabilidade)**: Registros brutos não auditados ou com alta incidência de falhas de extração. Requer cautela no uso analítico direto.

</details>

## Como contribuir
Convidamos pesquisadores, desenvolvedores e entusiastas da ciência aberta a colaborar conosco:
- **Sugerir fontes de dados**: Conhece uma base acadêmica brasileira pública que precisa de uma API? [Envie sua sugestão pelo formulário](https://forms.google.com/sua-url-de-sugestao-aqui).
- **Desenvolver e aprimorar**: Colaborar no desenvolvimento das nossas APIs e ferramentas no GitHub.
- **Abrir Issues**: Enviar feedbacks, correções de bugs ou idéias diretamente nos nossos repositórios.
- **Divulgar**: Compartilhar nossas ferramentas com pesquisadores e a comunidade acadêmica.

## Princípios
Nossa atuação é guiada pelos princípios e declarações internacionais de Ciência Aberta:

- **[Princípios FAIR](https://www.go-fair.org/fair-principles/)**: Compromisso em disponibilizar dados **Localizáveis, Acessíveis, Interoperáveis e Reutilizáveis** (*Findable, Accessible, Interoperable, Reusable*).
- **[Budapest Open Access Initiative (BOAI)](https://www.budapestopenaccessinitiative.org/)**: Alinhamento com as diretrizes históricas de Acesso Aberto para o livre uso, distribuição e reutilização do conhecimento científico.
- **Dados Abertos**: Garantia de acesso livre, gratuito e sem restrições a todas as bases geradas.
- **Software Livre**: Código-fonte 100% aberto sob licenças permissivas.
- **Transparência**: Processos de coleta, tratamento e documentação abertos e auditáveis pela comunidade.

## About Us & Our Mission
**BRAN Org** is an independent organization dedicated to building open infrastructure for academic and scientific information in **Brazil**.

We map **academic data that is already public**, but lacks APIs or easy programmatic access. Our work is to collect, clean, and provide this information in open and standardized formats through public APIs and open-source tools, lowering technical barriers for researchers and boosting quantitative studies on Brazilian scientific output.

## Our Goals
- **Map Brazilian Sources**: Identify public academic collections, repositories, and databases that lack programmatic access.
- **Structure Public Data**: Convert raw or fragmented data into clean, standardized formats ready for analysis.
- **Create Open APIs**: Provide public, accessible endpoints for integration into research and software.
- **Develop Tools**: Build open-source packages and applications focused on quantitative scientific analysis.

## Our Projects

### Databases & Collections

This section aggregates the open academic collections and repositories maintained and curated by **BRAN Org**:

- **What it is**: The central catalog of Brazilian academic databases converted into open, standardized formats.
- **What it contains**: Comprehensive bibliometric data from scientific events and journals (articles, authors, affiliations, abstracts, citations, and methodological metadata).
- **How it works**: Each repository serves standardized data files (`JSON`/`CSV`), alongside a **free, public REST API** (no API key required) and an **interactive Web Dashboard** for real-time visual exploration and analysis.

| [ebbc-open-database](https://github.com/BRAN-Org/ebbc-open-database) | [EBBC](https://ebbc.ibict.br/) | **643 Articles** (2012-2024) | [🟡 Source Faithful (Limitations)](#-data-reliability-levels) |

<details>
<summary><b>Data Reliability Levels</b></summary>
<br>

To ensure academic transparency and scientific rigor, every **BRAN Org** dataset features a data reliability tier:

- 🟢 **Green (100% Audited & Complete)**: Fully extracted, validated, and sanitized. Contains all fundamental metadata without known gaps.
- 🔵 **Blue (High Fidelity with Sparse Omissions)**: Complete coverage of editions/years and DOIs, containing only rare metadata gaps inherited directly from the official website.
- 🟡 **Yellow (100% Faithful to Source with Native Limitations)**: 100% of articles available online on the official website were extracted without loss, but the official source presents native limitations (e.g., lack of DOIs in proceedings or missing early historical proceedings not digitized online). *(Ex: `ebbc-open-database`)*.
- 🟠 **Orange (In Curation / Processing)**: Extraction completed successfully, but the collection is undergoing curation, schema validation, and metadata sanitation. *(Ex: `abec-open-database`)*.
- 🔴 **Red (Unaudited Data / Low Reliability)**: Unaudited raw records or high incidence of extraction errors. Requires caution for direct analytical use.

</details>
