name: Reusable BRAN Bot CI/CD

on:
  workflow_call:
    inputs:
      project_type:
        description: 'Tipo do projeto (r-package, python, node, general)'
        required: false
        type: string
        default: 'general'
      run_tests:
        description: 'Executar testes automatizados'
        required: false
        type: boolean
        default: true
    secrets:
      BRAN_APP_ID:
        required: false
      BRAN_PRIVATE_KEY:
        required: false

jobs:
  bran-governance:
    name: BRAN Bot Governance & CI
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obter Token do BRAN Bot (GitHub App)
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.BRAN_APP_ID }}
          private-key: ${{ secrets.BRAN_PRIVATE_KEY }}

      - name: Definir Token Ativo
        id: auth
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "token=${{ steps.app-token.outputs.token }}" >> $GITHUB_OUTPUT
            echo "bot_name=bran-bot[bot]" >> $GITHUB_OUTPUT
          else
            echo "token=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_OUTPUT
            echo "bot_name=github-actions[bot]" >> $GITHUB_OUTPUT
          fi

      # Validação de Commits e PR
      - name: Validar Convenções de Commit (PR)
        if: github.event_name == 'pull_request'
        run: |
          echo "Validando título do PR contra Conventional Commits..."
          TITLE="${{ github.event.pull_request.title }}"
          if [[ ! "$TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?:[[:space:]].+ ]]; then
            echo "⚠️ Aviso: O título do PR '$TITLE' não segue o padrão Conventional Commits (ex: feat(api): adicionar endpoint)."
          else
            echo "✅ Título em conformidade com Conventional Commits."
          fi

      # Se for R-package
      - name: Setup R
        if: inputs.project_type == 'r-package' || hashFiles('DESCRIPTION') != ''
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Testar Pacote R (testthat)
        if: (inputs.project_type == 'r-package' || hashFiles('DESCRIPTION') != '') && inputs.run_tests
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::testthat

      - name: R CMD check
        if: (inputs.project_type == 'r-package' || hashFiles('DESCRIPTION') != '') && inputs.run_tests
        run: Rscript -e "rcmdcheck::rcmdcheck(args = c('--no-manual', '--as-cran'), error_on = 'error')"

      # Se for Python
      - name: Setup Python
        if: inputs.project_type == 'python' || hashFiles('pyproject.toml') != '' || hashFiles('setup.py') != '' || hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testar Python
        if: (inputs.project_type == 'python' || hashFiles('pyproject.toml') != '' || hashFiles('setup.py') != '' || hashFiles('requirements.txt') != '') && inputs.run_tests
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -d tests ]; then
            pip install pytest
            pytest
          fi

      - name: Feedback do BRAN Bot no PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const message = `🤖 **BRAN Bot Guardrail**: O pipeline de validação detectou inconsistências nesta branch. Por favor, verifique os logs de execução e execute os testes localmente antes de solicitar review.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
